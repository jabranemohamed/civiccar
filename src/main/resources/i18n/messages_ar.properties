email.report.created.body=مرحباً،\n\nتم استلام تبليغكم {0} من طرف سيفيك كير تونس (خدمة تجريبية).\n\nسيتم التحقق منه قبل النشر ثم إحالته إلى الفريق المختص.\nالصفحة العمومية: {1}\n\nلتلقي التحديثات بالبريد الإلكتروني، فعّلوا الاشتراك: {2}\nدون تفعيل، لن تصلكم أي إشعارات.\n\nسيفيك كير تونس
