email.subscription.confirm.body=مرحباً،\n\nلتفعيل إشعارات التبليغ {0} بالبريد الإلكتروني، أكدوا عبر هذا الرابط:\n{1}\n\nتنتهي صلاحية هذا الرابط خلال 7 أيام ويُستعمل مرة واحدة فقط. إذا لم تطلبوا ذلك، تجاهلوا هذه الرسالة: لن يُنشأ أي اشتراك.\n\nسيفيك كير تونس
